[project]
name = "rsm2ftok"
version = "0.1.0"
description = "Remote-sensing mask tokenization and multimodal language model training"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "flash-attn==2.7.3",
    "pycocotools>=2.0.10",
    "pycocoevalcap",
    "scikit-learn",
    "timm==1.0.17",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "xtuner[deepspeed]==0.1.23",
    "qwen-vl-utils==0.0.14",
    "numpy==2.3.4",
    "opencv-python-headless==4.11.0.86",
    "scipy==1.16.2",
    "accelerate==1.10.1",
    "tokenizers==0.22.1",
    "setuptools>=68",
]

[project.optional-dependencies]
vlm = [
  "transformers==4.57.1",
  "peft==0.17.1",
  "decord2==1.0.0",
  "hydra-core>=1.3.2",
]
tokenizer = [
  "cython",
  "h5py",
  "scikit-image",
  "shapely",
  "submitit",
]

[tool.uv]
no-build-isolation-package = ["flash-attn"]
link-mode = "copy"

[tool.uv.pip]
extra-index-url = [
    "https://download.pytorch.org/whl/cu124"
]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu12", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu12", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu12"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.dependency-metadata]]
name = "mmengine"
version = "0.10.7"
requires-dist = [
  "addict", "matplotlib", "numpy", "opencv-python-headless", 
  "pyyaml", "rich", "termcolor", "yapf",
]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.7.3"
requires-dist = ["torch", "einops"]

[tool.uv.extra-build-dependencies]
flash-attn = [
  { requirement = "torch", match-runtime = true },
  "setuptools",
]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }
